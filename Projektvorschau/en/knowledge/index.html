    @media(max-width:600px){.gate{padding:24px}.kicker{margin-top:55px}h1{font-size:61px}.copy{font-size:16px}.row{grid-template-columns:1fr}input{border-right:1px solid var(--ink)}button{height:52px}}

    const bytes=value=>Uint8Array.from(atob(value),char=>char.charCodeAt(0));
    const text=new TextDecoder();
    async function decrypt(rawKey){
      const key=await crypto.subtle.importKey("raw",rawKey,{name:"AES-GCM"},false,["decrypt"]);
      const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(IV)},key,bytes(DATA));

    async function derive(password){
      const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveBits"]);

      const saved=sessionStorage.getItem(STORE);if(!saved)return;
      try{await decrypt(bytes(saved))}catch{sessionStorage.removeItem(STORE)}

    document.getElementById("access-form").addEventListener("submit",async event=>{
