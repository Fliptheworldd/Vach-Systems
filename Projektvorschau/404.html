<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,noimageindex">
  <title>Geschützte Projektvorschau · Vachsystems</title>
  <link rel="icon" href="/Projektvorschau/favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:light;font-family:Arial,Helvetica,sans-serif;--ink:#111315;--paper:#f3f1ea;--blue:#1458e7;--acid:#d8ff32}
    *{box-sizing:border-box}body{min-height:100svh;margin:0;background:var(--paper);color:var(--ink)}
    .gate{min-height:100svh;display:grid;place-items:center;padding:32px;position:relative;overflow:hidden}.gate:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.9%,rgba(17,19,21,.08) 50%,transparent 50.1%),linear-gradient(rgba(17,19,21,.04) 1px,transparent 1px);background-size:100% 100%,100% 48px;pointer-events:none}
    .card{position:relative;width:min(680px,100%);border-top:6px solid var(--ink);padding-top:28px}.brand{display:flex;width:max-content;font-size:14px;line-height:.8;font-weight:900;letter-spacing:.04em}.brand span:first-child{background:var(--ink);color:var(--acid);padding:8px 7px 7px}.brand span:last-child{border:2px solid var(--ink);padding:6px 7px 5px}
    .kicker{margin:72px 0 18px;font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}h1{font:400 clamp(58px,9vw,102px)/.79 Georgia,"Times New Roman",serif;letter-spacing:-.07em;margin:0}h1 i{color:var(--blue);font-weight:400}.copy{font:18px/1.5 Georgia,"Times New Roman",serif;max-width:540px;margin:36px 0}
    form{border-top:1px solid var(--ink);padding-top:18px}label{display:block;margin-bottom:9px;font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.row{display:grid;grid-template-columns:1fr auto}input{min-width:0;height:56px;border:1px solid var(--ink);border-right:0;background:rgba(255,255,255,.55);padding:0 16px;font:18px Georgia,serif;outline:0}input:focus{box-shadow:inset 0 0 0 2px var(--blue)}button{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:0 22px;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}button:disabled{cursor:wait;opacity:.65}.error{min-height:18px;margin:12px 0 0;color:#b72518;font-size:12px;font-weight:700}.note{margin:42px 0 0;font-size:8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#686864}
    @media(max-width:600px){.gate{padding:24px}.kicker{margin-top:55px}h1{font-size:61px}.copy{font-size:16px}.row{grid-template-columns:1fr}input{border-right:1px solid var(--ink)}button{height:52px}}
  </style>
</head>
<body>
  <main class="gate">
    <section class="card" aria-labelledby="access-title">
      <div class="brand" aria-label="Vachsystems"><span>VACH</span><span>SYSTEMS</span></div>
      <p class="kicker">Nicht öffentliche Projektvorschau</p>
      <h1 id="access-title">Geschützter<br><i>Zugang.</i></h1>
      <p class="copy">Dieser Bereich enthält einen frühen, unverbindlichen Konzeptstand von Vachsystems. Der Zugriff ist ausschließlich mit dem vereinbarten Kennwort möglich.</p>
      <form id="access-form">
        <label for="preview-password">Kennwort</label>
        <div class="row"><input id="preview-password" type="password" autocomplete="current-password" required autofocus><button type="submit">Entwurf öffnen</button></div>
        <p class="error" id="access-error" role="alert" aria-live="polite"></p>
      </form>
      <p class="note">Vachsystems · Verschlüsselte Projektvorschau · August 2026</p>
    </section>
  </main>
  <script>
  (()=>{
    const DATA="JDu7m6MGbHaTd/2nyNVVKRYPMjMg81xXn9ujd8nZyEIptdqLHN2B1j0kTP6h2j/UDrlxJO+OxsyEVQpulDdmQ+XDzCB32aNzpndoNd1nlm0n3KGC/3/KyvuYQmeShaKK+Gd0K58e+ZoUkyaWvkKNPJCKUBxIKBFx+1iMbhfFvLFS1ZrNhFMOZQOyY8k3z1m7hTTNbJ02gYy9TBTJFH3ihMQCfZ1coGwv1NgtMkwj3Qo+ASBJ8Mg+lVC36Zqxllzg1gweISzUw4L5mOsEAME6pBncpQcSRoCRbtFdLfatmx6pxA44gH0riyrKmXIinwrOa4h/4ZeFIhrf/FTc5BEpz2FQ+8PVtf2WVGJgp6o2eUuv/wwi2av1TiAZdXmwuVB0o4NH4frDRY9TF9AdCuHVkNk7VsereWBJ9t1zsolE5nB8E18g7evP",IV="KevRCqziVp/VsL4b",SALT="GkNn5rhj3GHPuVOQzFKUVx14jYLbLPPo",ROUNDS=310000,STORE="vachsystems-preview-key-v1";
    const bytes=value=>Uint8Array.from(atob(value),char=>char.charCodeAt(0));
    const text=new TextDecoder();
    async function decrypt(rawKey){
      const key=await crypto.subtle.importKey("raw",rawKey,{name:"AES-GCM"},false,["decrypt"]);
      const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(IV)},key,bytes(DATA));
      document.open();document.write(text.decode(plain));document.close();
    }
    async function derive(password){
      const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveBits"]);
      return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:bytes(SALT),iterations:ROUNDS},material,256));
    }
    function encode(value){let binary="";value.forEach(byte=>binary+=String.fromCharCode(byte));return btoa(binary)}
    async function restore(){
      const saved=sessionStorage.getItem(STORE);if(!saved)return;
      try{await decrypt(bytes(saved))}catch{sessionStorage.removeItem(STORE)}
    }
    document.getElementById("access-form").addEventListener("submit",async event=>{
      event.preventDefault();const button=event.currentTarget.querySelector("button"),error=document.getElementById("access-error"),input=document.getElementById("preview-password");
      button.disabled=true;button.textContent="Prüfen …";error.textContent="";
      try{const rawKey=await derive(input.value.trim());await decrypt(rawKey);sessionStorage.setItem(STORE,encode(rawKey))}
      catch{error.textContent="Das Kennwort ist nicht korrekt.";button.disabled=false;button.textContent="Entwurf öffnen";input.select()}
    });
    restore();
  })();
  </script>
</body>
</html>
