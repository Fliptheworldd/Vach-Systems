    :root{color-scheme:light;font-family:Arial,Helvetica,sans-serif;--ink:#111315;--paper:#f3f1ea;--blue:#1458e7;--acid:#d8ff32}
    *{box-sizing:border-box}body{min-height:100svh;margin:0;background:var(--paper);color:var(--ink)}
    .gate{min-height:100svh;display:grid;place-items:center;padding:32px;position:relative;overflow:hidden}.gate:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.9%,rgba(17,19,21,.08) 50%,transparent 50.1%),linear-gradient(rgba(17,19,21,.04) 1px,transparent 1px);background-size:100% 100%,100% 48px;pointer-events:none}

    .kicker{margin:72px 0 18px;font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}h1{font:400 clamp(58px,9vw,102px)/.79 Georgia,"Times New Roman",serif;letter-spacing:-.07em;margin:0}h1 i{color:var(--blue);font-weight:400}.copy{font:18px/1.5 Georgia,"Times New Roman",serif;max-width:540px;margin:36px 0}
    form{border-top:1px solid var(--ink);padding-top:18px}label{display:block;margin-bottom:9px;font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.row{display:grid;grid-template-columns:1fr auto}input{min-width:0;height:56px;border:1px solid var(--ink);border-right:0;background:rgba(255,255,255,.55);padding:0 16px;font:18px Georgia,serif;outline:0}input:focus{box-shadow:inset 0 0 0 2px var(--blue)}button{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:0 22px;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}button:disabled{cursor:wait;opacity:.65}.error{min-height:18px;margin:12px 0 0;color:#b72518;font-size:12px;font-weight:700}.note{margin:42px 0 0;font-size:8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#686864}
    @media(max-width:600px){.gate{padding:24px}.kicker{margin-top:55px}h1{font-size:61px}.copy{font-size:16px}.row{grid-template-columns:1fr}input{border-right:1px solid var(--ink)}button{height:52px}}
