<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,noimageindex">
  <title>Geschützte Vorschau</title>
  <style>
    :root{color-scheme:light;font-family:Arial,Helvetica,sans-serif;--ink:#15171a;--paper:#f5f4ef;--accent:#245ee8}
    *{box-sizing:border-box}
    body{min-height:100svh;margin:0;background:var(--paper);color:var(--ink)}
    .gate{min-height:100svh;display:grid;place-items:center;padding:32px;position:relative;overflow:hidden}
    .gate:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(21,23,26,.035) 1px,transparent 1px);background-size:100% 48px;pointer-events:none}
    .card{position:relative;width:min(680px,100%);border-top:6px solid var(--ink);padding-top:28px}
    .lock{width:34px;height:34px;border:1px solid var(--ink);display:grid;place-items:center;margin-bottom:68px}
    .lock svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .kicker{margin:0 0 18px;font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
    h1{font:400 clamp(58px,9vw,102px)/.79 Georgia,"Times New Roman",serif;letter-spacing:-.07em;margin:0}
    h1 i{color:var(--accent);font-weight:400}
    .copy{font:18px/1.5 Georgia,"Times New Roman",serif;max-width:540px;margin:36px 0}
    form{border-top:1px solid var(--ink);padding-top:18px}
    label{display:block;margin-bottom:9px;font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
    .row{display:grid;grid-template-columns:1fr auto}
    input{min-width:0;height:56px;border:1px solid var(--ink);border-right:0;background:rgba(255,255,255,.6);padding:0 16px;font:18px Georgia,serif;outline:0}
    input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
    button{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:0 22px;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
    button:disabled{cursor:wait;opacity:.65}
    .error{min-height:18px;margin:12px 0 0;color:#b72518;font-size:12px;font-weight:700}
    .note{margin:42px 0 0;font-size:8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#686864}
    @media(max-width:600px){.gate{padding:24px}.lock{margin-bottom:54px}h1{font-size:61px}.copy{font-size:16px}.row{grid-template-columns:1fr}input{border-right:1px solid var(--ink)}button{height:52px}}
  </style>
</head>
<body>
  <main class="gate">
    <section class="card" aria-labelledby="access-title">
      <div class="lock" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg></div>
      <p class="kicker">Geschützter Bereich</p>
      <h1 id="access-title">Vertrauliche<br><i>Vorschau.</i></h1>
      <p class="copy">Dieser Bereich ist nicht öffentlich zugänglich. Bitte geben Sie das vereinbarte Kennwort ein.</p>
      <form id="access-form">
        <label for="preview-password">Kennwort</label>
        <div class="row"><input id="preview-password" type="password" autocomplete="current-password" required autofocus><button type="submit">Öffnen</button></div>
        <p class="error" id="access-error" role="alert" aria-live="polite"></p>
      </form>
      <p class="note">Nicht öffentlich · Zugriff nur mit Freigabe</p>
    </section>
  </main>
  <script>
  (()=>{
    const PAYLOAD="/Projektvorschau/_payload-7d5f2a91.txt";
    const STORE="protected-preview-access-v2";
    const bytes=value=>Uint8Array.from(atob(value),char=>char.charCodeAt(0));
    const encode=value=>{let binary="";value.forEach(byte=>binary+=String.fromCharCode(byte));return btoa(binary)};
    const text=new TextDecoder();
    let configPromise;
    function extract(raw,re,label){const match=raw.match(re);if(!match)throw new Error("Konfiguration fehlt: "+label);return match[1]}
    function loadConfig(){
      if(!configPromise)configPromise=fetch(PAYLOAD,{cache:"no-store"}).then(response=>{if(!response.ok)throw new Error("Vorschau nicht verfügbar");return response.text()}).then(raw=>({
        DATA:extract(raw,/const DATA="([^"]+)"/,"DATA"),
        IV:extract(raw,/const IV="([^"]+)"/,"IV"),
        SALT:extract(raw,/const SALT="([^"]+)"/,"SALT"),
        ROUNDS:Number(extract(raw,/const ROUNDS=(\d+)/,"ROUNDS"))
      }));
      return configPromise;
    }
    async function derive(password){
      const cfg=await loadConfig();
      const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveBits"]);
      return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:bytes(cfg.SALT),iterations:cfg.ROUNDS},material,256));
    }
    async function decrypt(rawKey){
      const cfg=await loadConfig();
      const key=await crypto.subtle.importKey("raw",rawKey,{name:"AES-GCM"},false,["decrypt"]);
      const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(cfg.IV)},key,bytes(cfg.DATA));
      document.open();document.write(text.decode(plain));document.close();
    }
    async function restore(){
      const saved=sessionStorage.getItem(STORE);if(!saved)return;
      try{await decrypt(bytes(saved))}catch{sessionStorage.removeItem(STORE)}
    }
    document.getElementById("access-form").addEventListener("submit",async event=>{
      event.preventDefault();
      const button=event.currentTarget.querySelector("button"),error=document.getElementById("access-error"),input=document.getElementById("preview-password");
      button.disabled=true;button.textContent="Prüfen …";error.textContent="";
      try{const rawKey=await derive(input.value.trim());await decrypt(rawKey);sessionStorage.setItem(STORE,encode(rawKey))}
      catch{error.textContent="Das Kennwort ist nicht korrekt.";button.disabled=false;button.textContent="Öffnen";input.select()}
    });
    restore();
  })();
  </script>
</body>
</html>
