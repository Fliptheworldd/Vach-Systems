<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="t d"><title id="t">Digitale Systemlandschaft</title><desc id="d">Individuelle Visualisierung für Strategie, Web, Software und Automatisierung.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071019"/><stop offset="1" stop-color="#0c1b28"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d2a"/><stop offset="1" stop-color="#0a131d"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0b78ff"/><stop offset="1" stop-color="#36d7ee"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="14"/></filter></defs><rect width="1200" height="820" fill="url(#bg)"/><circle cx="1060" cy="70" r="210" fill="none" stroke="#32d7ed" stroke-opacity=".12"/><circle cx="150" cy="735" r="270" fill="#0d78ff" fill-opacity=".08" filter="url(#glow)"/><g opacity=".34" stroke="#8da3b5" stroke-width="1"><path d="M0 137h1200M0 274h1200M0 411h1200M0 548h1200M0 685h1200"/><path d="M200 0v820M400 0v820M600 0v820M800 0v820M1000 0v820"/></g><g font-family="Inter,Arial,sans-serif"><text x="72" y="82" fill="#63e6f5" font-size="18" font-weight="700" letter-spacing="4">SYSTEMÜBERSICHT</text><text x="72" y="132" fill="#fff" font-size="39" font-weight="700">Vom Problem zur funktionierenden Lösung.</text><text x="72" y="166" fill="#9eacb9" font-size="18">Struktur, Software und Automatisierung greifen ineinander.</text></g><path d="M160 350 C300 350 300 255 440 255 S580 465 720 465 S860 290 1020 290" fill="none" stroke="url(#cyan)" stroke-width="3"/><g fill="#0a1119" stroke="#2b3a49"><rect x="72" y="275" width="220" height="150" rx="12"/><rect x="345" y="180" width="250" height="170" rx="12"/><rect x="650" y="385" width="245" height="165" rx="12"/><rect x="940" y="205" width="190" height="150" rx="12"/></g><g font-family="Inter,Arial,sans-serif"><text x="98" y="313" fill="#63e6f5" font-size="13" font-weight="700">01 · VERSTEHEN</text><text x="98" y="353" fill="#fff" font-size="25" font-weight="700">Anforderung</text><text x="98" y="385" fill="#8f9baa" font-size="15">Ziel · Nutzer · Prozess</text><text x="371" y="218" fill="#63e6f5" font-size="13" font-weight="700">02 · STRUKTURIEREN</text><text x="371" y="258" fill="#fff" font-size="25" font-weight="700">Konzept</text><text x="371" y="290" fill="#8f9baa" font-size="15">UX · Daten · Architektur</text><text x="676" y="423" fill="#63e6f5" font-size="13" font-weight="700">03 · UMSETZEN</text><text x="676" y="463" fill="#fff" font-size="25" font-weight="700">System</text><text x="676" y="495" fill="#8f9baa" font-size="15">Web · Software · KI</text><text x="965" y="243" fill="#63e6f5" font-size="13" font-weight="700">04 · BETREIBEN</text><text x="965" y="283" fill="#fff" font-size="25" font-weight="700">Ergebnis</text><text x="965" y="315" fill="#8f9baa" font-size="15">Go-live · Lernen</text></g><g><circle cx="160" cy="350" r="8" fill="#3de0f0"/><circle cx="440" cy="255" r="8" fill="#3de0f0"/><circle cx="720" cy="465" r="8" fill="#3de0f0"/><circle cx="1020" cy="290" r="8" fill="#3de0f0"/></g><g transform="translate(72 620)"><rect width="1056" height="128" rx="12" fill="url(#card)" stroke="#253646"/><g font-family="Inter,Arial,sans-serif"><text x="28" y="38" fill="#6c7b89" font-size="12" letter-spacing="2">AKTUELLER STATUS</text><text x="28" y="77" fill="#fff" font-size="24" font-weight="700">Klare Entscheidungen statt Tool-Sammlung.</text><text x="28" y="104" fill="#8f9baa" font-size="15">Technik wird erst gewählt, wenn der tatsächliche Bedarf verstanden ist.</text></g><rect x="842" y="37" width="168" height="48" rx="24" fill="#0e1a24" stroke="#35d9ef" stroke-opacity=".45"/><circle cx="872" cy="61" r="7" fill="#21d786"/><text x="892" y="67" fill="#eaf4f8" font-family="Inter,Arial,sans-serif" font-size="14">Projekt klar</text></g></svg>