<!DOCTYPE html>
<html lang="de">
<head>
  <meta name="robots" content="noindex, follow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vach Systems - Wartung</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .maintenance-container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 80px;
            height: 80px;
            background: #000000;
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 40px;
            position: relative;
            overflow: hidden;
        }

        .logo::before {
            content: 'V';
            font-size: 48px;
            font-weight: 900;
            color: #ffffff;
            position: relative;
            z-index: 2;
        }

        .logo::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: #00d9ff;
            z-index: 1;
        }

        h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 18px;
            color: #999999;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.3);
            padding: 12px 24px;
            border-radius: 50px;
            margin-bottom: 40px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #00d9ff;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }

        .status-text {
            font-size: 14px;
            font-weight: 600;
            color: #00d9ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .contact-info {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .contact-label {
            font-size: 12px;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .contact-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .contact-link:hover {
            color: #00d9ff;
        }

        @media (max-width: 768px) {
            .maintenance-container {
                padding: 24px;
            }

            h1 {
                font-size: 32px;
            }

            .subtitle {
                font-size: 16px;
            }

            .logo {
                width: 60px;
                height: 60px;
            }

            .logo::before {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="logo"></div>
        
        <h1>Wartungsarbeiten</h1>
        
        <p class="subtitle">
            Wir optimieren gerade unsere Website, um Ihnen<br>
            ein noch besseres Erlebnis zu bieten.
        </p>
        
        <div class="status-badge">
            <span class="status-dot"></span>
            <span class="status-text">In Bearbeitung</span>
        </div>
        
        <p class="subtitle">
            Wir sind bald zurück.
        </p>
        
        <div class="contact-info">
            <div class="contact-label">Dringende Anfragen?</div>
            <a href="mailto:kontakt@vachsystems.de" class="contact-link">kontakt@vachsystems.de</a>
        </div>
    </div>
</body>
</html>
